name: Daily financial update
on:
  schedule:
    - cron: "0 20 * * 0-4"   # about 7:00 AM Sydney, Mon-Fri
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional: analyse these now, e.g. TSLA CBA.AX (leave empty to use watchlist.txt)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -u agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKERS: ${{ github.event.inputs.tickers }}
      - name: Save data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "Daily data" || echo "nothing to commit"
          git pull --rebase
          git push
