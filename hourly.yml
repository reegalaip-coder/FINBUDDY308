name: Hourly move alerts
on:
  schedule:
    - cron: "17 * * * *"   # every hour at 17 minutes past (off the busy top-of-hour)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -u alerts.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ALERT_PCT: "2"   # uncomment and change to alert on bigger or smaller moves
      - name: Save alert memory
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p state
          git add state
          if git diff --cached --quiet; then
            echo "nothing to save"
          else
            git commit -m "Alert state"
            git pull --rebase
            git push
          fi
